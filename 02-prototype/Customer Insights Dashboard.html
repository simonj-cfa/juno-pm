<style>

:root{

  --accent:#2c56c9; --accent-soft:#e6ecfb; --accent-ink:#ffffff;
  --new:#0b7a66; --new-soft:#dcf3ee; --warn:#a6500c; --warn-soft:#fbe9d8;
  --t-int:#6a45c0; --t-srv:#0c7a86; --t-tkt:#bd5316; --t-mtg:#51647d;
  --shadow:0 8px 30px rgba(20,28,40,.18);

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --surface-2:#202733; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2d3643; --line-strong:#434f61;

  --t-int:#a98bf0; --t-srv:#4cc3d0; --t-tkt:#f0915a; --t-mtg:#97a9c3; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --surface-2:#202733; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2d3643; --line-strong:#434f61;
  --accent:#7d9cf2; --accent-soft:#222f52; --accent-ink:#0f1522;
  --new:#4fd1b5; --new-soft:#143a33; --warn:#f0a35e; --warn-soft:#3d2a17;
  --t-int:#a98bf0; --t-srv:#4cc3d0; --t-tkt:#f0915a; --t-mtg:#97a9c3; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-block:20px 14px}
.top h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);margin:2px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.badge{border:1px dashed var(--line-strong);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-block:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 22px}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.seg button{border:0;background:none;padding:6px 11px;border-right:1px solid var(--line);color:var(--muted)}
.seg button:last-child{border-right:0}

.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:16px}

h2{font-size:15px;font-weight:600;margin:0}

.panel-h{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h small{color:var(--muted);font-size:12.5px}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);margin-bottom:20px}
.today>div{padding:14px 16px;min-width:0}
.today>div+div{border-left:1px solid var(--line)}
.today h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.chg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chg li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.chg li button:hover{border-color:var(--accent)}
.chg .k{flex:none;margin-top:1px}
.chg .tx{min-width:0}
.chg .tx small{display:block;color:var(--muted);font-size:12.5px}
.tq{display:flex;flex-direction:column;gap:10px}
.tq .q{font-size:13.5px}
.mixrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

/* pills & chips */
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.new{background:var(--new-soft);color:var(--new)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.strong{background:var(--accent);color:var(--accent-ink)}
.pill.mod{background:var(--accent-soft);color:var(--accent)}

.tc{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;background:var(--surface)}

.tc.int{color:var(--t-int)}.tc.srv{color:var(--t-srv)}.tc.tkt{color:var(--t-tkt)}.tc.mtg{color:var(--t-mtg)}
.tc span{color:var(--ink)}
.tc.zero{opacity:.4}

.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sort{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.sort .seg button{padding:4px 9px;font-size:12.5px}
.themes{display:flex;flex-direction:column;gap:16px}
.theme-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.theme-h .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.theme-h p{margin:0;color:var(--muted);font-size:13px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);max-width:340px}
.bar i{display:block}
.bar .int{background:var(--t-int)}.bar .srv{background:var(--t-srv)}.bar .tkt{background:var(--t-tkt)}.bar .mtg{background:var(--t-mtg)}
.prob{border-top:1px solid var(--line)}
.prob:first-of-type{border-top:0}
.prob-head{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto 18px;gap:6px 14px;align-items:center;padding:12px 16px;border:0;background:none;text-align:left}
.prob-head:hover{background:var(--surface-2)}
.sig{display:flex;flex-direction:column;align-items:center;line-height:1}
.sig b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.sig small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.ptitle{font-weight:500;font-size:14.5px}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.tri{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:210px}
.chev{transition:transform .15s;color:var(--muted)}
.prob-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.spark{display:block}
.spark rect{fill:var(--line-strong)}
.spark rect.cur{fill:var(--accent)}
.prob-body{padding:2px 16px 16px 86px;display:flex;flex-direction:column;gap:12px}
.stmt{margin:0;max-width:70ch}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.feat{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 8px;font-size:12.5px}
.quotes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.quote{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.quote blockquote{margin:0;max-width:75ch}
.quote blockquote::before{content:"\201C"}
.quote blockquote::after{content:"\201D"}
.qf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.qf .src{font-family:var(--mono);font-size:12px;color:var(--ink)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:3px 10px;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.qf .btn{margin-left:auto}
.ok{color:var(--new);font-weight:500}
.more{align-self:flex-start;border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}

/* features */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}
.fl{list-style:none;margin:0;padding:4px 0}
.fl li button{width:100%;text-align:left;border:0;background:none;padding:10px 16px;display:flex;flex-direction:column;gap:5px}
.fl li button:hover{background:var(--surface-2)}
.fl .r1{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.fl .r1 span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.fl .meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.fl .meter i{display:block;height:100%;background:var(--accent)}
.fl small{color:var(--muted);font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dh h2{font-size:16px;margin-top:6px}
.db{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0}
.dl dt{color:var(--muted);font-size:12.5px}
.dl dd{margin:0}
.ctx{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ctx .p{color:var(--muted);font-size:13px}
.ctx mark{background:var(--accent-soft);color:var(--ink);padding:1px 2px;border-bottom:2px solid var(--accent)}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:60;font-size:13px}

@media (max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static}}

  .today{grid-template-columns:minmax(0,1fr)}.today>div+div{border-left:0;border-top:1px solid var(--line)}
  .prob-head{grid-template-columns:44px minmax(0,1fr) 18px}
  .prob-head .tri{grid-column:2/4;justify-content:flex-start;max-width:none}
  .prob-body{padding-left:16px}
  .filters{position:static}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 // P1 Python setup

 ['P1','ticket',9,'PY','LR','Zendesk ZD-47966','Comment 1','Learner','Subject: Module not found in Lab 2','ModuleNotFoundError: No module named ‘riskkit’. The install instructions in the PDF are for an older version.'],

 ['P9','survey',0,'PW','CH','Charterholder Pulse Q3-26','Q12 · Resp #2240','Charterholder','Q12: Where did you use the simulation?','I tried it on my iPad on a flight. The layout broke and I couldn’t type in the notes panel.'],

const EV = RAW.map((r,i)=>({id:'e'+i,p:r[0],type:r[1],ago:r[2],proj:r[3],pers:r[4],src:r[5],loc:r[6],who:r[7],prompt:r[8],quote:r[9]}));

/* ---------- helpers ---------- */
const DOY = Math.round((TODAY - new Date(2026,0,1)) / 864e5);
const RANGES = [
  ['today','Today',a=>a===0], ['7d','Last 7 days',a=>a<=6], ['30d','Last 30 days',a=>a<=29],
  ['mtd','Month to date',a=>a<=TODAY.getDate()-1], ['ytd','Year to date',a=>a<=DOY], ['all','All time',()=>true]
];
const SORTS = [['priority','Signal strength'],['recent','Most recent']];
const state = {range:'30d', proj:'all', pers:'all', sort:'priority', open:new Set(['P1','P2','P4','P8']), allq:new Set(), drawer:null, verified:new Set()};
try{ JSON.parse(localStorage.getItem('ci-verified')||'[]').forEach(x=>state.verified.add(x)); }catch(e){}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dateOf = a=>{const d=new Date(TODAY); d.setDate(d.getDate()-a); return d;};
const fmt = a=>dateOf(a).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const rel = a=>a===0?'Today':a===1?'Yesterday':a+' days ago';
const rangeFn = ()=>RANGES.find(r=>r[0]===state.range)[2];
const scoped = ()=>EV.filter(e=>(state.proj==='all'||e.proj===state.proj)&&(state.pers==='all'||e.pers===state.pers));
const inView = ()=>scoped().filter(e=>rangeFn()(e.ago));
const typeCounts = list=>{const c={interview:0,survey:0,ticket:0,meeting:0}; list.forEach(e=>c[e.type]++); return c;};
const nTypes = c=>Object.values(c).filter(v=>v>0).length;
const prob = id=>PROBLEMS.find(p=>p.id===id);
const chip = (t,n)=>`<span class="tc ${TYPES[t].cls}${n===0?' zero':''}" title="${TYPES[t].label}"><i></i>${TYPES[t].label.replace('Support ticket','Ticket').replace('Internal meeting','Meeting')} <span>${n}</span></span>`;
const chips = c=>Object.keys(TYPES).map(t=>chip(t,c[t])).join('');
const strength = (n,t)=> t>=3&&n>=5 ? ['strong','Strong signal'] : (t>=2&&n>=3 ? ['mod','Moderate'] : ['early','Early']);
const score = (n,t)=> n*(1+0.6*(t-1));

/* ---------- derived ---------- */
function problemStats(){
  const view = inView(), all = scoped();
  return PROBLEMS.map(p=>{
    const list = view.filter(e=>e.p===p.id);
    const every = all.filter(e=>e.p===p.id);
    const c = typeCounts(list), t = nTypes(c);
    return {p, list:list.sort((a,b)=>a.ago-b.ago), c, t, n:list.length, today:every.filter(e=>e.ago===0).length,
      first: every.length? Math.max(...every.map(e=>e.ago)) : null, total:every.length, every};
  }).filter(s=>s.n>0);
}

/* ---------- render ---------- */
function renderFilters(){
  const mk=(el,key,opts)=>{ $(el).innerHTML = opts.map(([v,l])=>`<button type="button" data-f="${key}" data-v="${v}" aria-pressed="${state[key]===v}">${l}</button>`).join(''); };
  mk('#f-range','range',RANGES.map(r=>[r[0],r[1]]));
  mk('#f-proj','proj',[['all','All'],['PY','Python simulation'],['PW','Private Wealth simulation']]);
  mk('#f-pers','pers',[['all','All'],['CH','CFA charterholders'],['LR','CFA learners'],['IN','Internal']]);
  mk('#f-sort','sort',SORTS);
}

function quoteHTML(e, showProblem){
  const v = state.verified.has(e.id);
  return `<li class="quote">
    <blockquote>${esc(e.quote)}</blockquote>
    <div class="qf">
      ${chip(e.type,'').replace(/ <span><\/span>/,'')}
      <span class="src">${esc(e.src)} · ${esc(e.loc)}</span>
      <span>${esc(e.who)}</span><span>${e.ago===0?'<span class="pill new">Today</span>':fmt(e.ago)}</span>
      ${v?'<span class="ok">✓ Verified</span>':''}
      <button class="btn" data-act="source" data-id="${e.id}">View source</button>
    </div></li>`;
}

function renderStats(){
  const list = inView(), c = typeCounts(list), ps = problemStats();
  const strong = ps.filter(s=>strength(s.n,s.t)[0]==='strong').length;
  const today = scoped().filter(e=>e.ago===0).length;
  $('#stats').innerHTML = [
    [list.length,'pieces of feedback in view'],[today,'new today'],[ps.length,'customer problems'],
    [strong,'strong signals (3+ source types)']
  ].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}

function renderToday(){
  const all = scoped(), todays = all.filter(e=>e.ago===0), prior = all.filter(e=>e.ago>0);
  const items = [];
  const tc = typeCounts(todays);
  PROBLEMS.forEach(p=>{
    const every = all.filter(e=>e.p===p.id); if(!every.length) return;
    const td = every.filter(e=>e.ago===0).length, first = Math.max(...every.map(e=>e.ago));
    const before = nTypes(typeCounts(every.filter(e=>e.ago>0))), after = nTypes(typeCounts(every));
    if(first<=2) items.push({o:0,id:p.id,k:'<span class="pill warn">Emerging</span>',h:p.title,s:`First seen ${first===0?'today':first+' days ago'}. ${every.length} mentions across ${after} source types so far.`});
    else if(td>0 && before<3 && after>=3) items.push({o:1,id:p.id,k:'<span class="pill strong">Triangulated</span>',h:p.title,s:`Today’s feedback adds a ${after}rd source type. Now ${every.length} mentions in total.`.replace('3rd','3rd').replace('4rd','4th')});
    else if(td>0) items.push({o:2-td/10,id:p.id,k:`<span class="pill new">+${td} today</span>`,h:p.title,s:`${every.length} mentions in total across ${after} source types.`});
  });
  items.sort((a,b)=>a.o-b.o);
  const quotes = todays.slice().sort((a,b)=>(prob(a.p)?1:0)-(prob(b.p)?1:0)).slice(0,3);
  $('#today').innerHTML = `
    <div style="grid-column:1/-1;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline">
      <h2>Today’s update</h2><small style="color:var(--muted);font-size:12.5px">${todays.length} new items since yesterday · follows the project and persona filters, not the date filter</small></div>
    <div>
      <h3>What changed</h3>
      <div class="mixrow">${chips(tc)}</div>
      ${items.length?`<ul class="chg">${items.slice(0,5).map(i=>`<li><button type="button" data-act="goto" data-id="${i.id}"><span class="k">${i.k}</span><span class="tx">${esc(i.h)}<small>${esc(i.s)}</small></span></button></li>`).join('')}</ul>`:'<p class="note">No new feedback today for this selection.</p>'}
    </div>
    <div>
      <h3>Latest quotes</h3>
      ${quotes.length?`<ul class="quotes">${quotes.map(e=>`<li class="quote"><blockquote>${esc(e.quote)}</blockquote><div class="qf"><span class="pill early">${esc(prob(e.p).title.length>44?prob(e.p).title.slice(0,42)+'…':prob(e.p).title)}</span>${chip(e.type,'').replace(/ <span><\/span>/,'')}<span class="src">${esc(e.src)}</span><button class="btn" data-act="source" data-id="${e.id}">View source</button></div></li>`).join('')}</ul>`:'<p class="note">Nothing new today.</p>'}
    </div>`;
}

function spark(every){
  const W=12, bins=Array(W).fill(0);
  every.forEach(e=>{const w=Math.floor(e.ago/7); if(w<W) bins[W-1-w]++;});
  const m=Math.max(1,...bins);
  return `<svg class="spark" width="72" height="22" viewBox="0 0 72 22" role="img" aria-label="Mentions per week, last 12 weeks: ${bins.join(', ')}">${bins.map((v,i)=>{const h=v?Math.max(3,Math.round(v/m*20)):1;return `<rect class="${i===W-1?'cur':''}" x="${i*6}" y="${22-h}" width="5" height="${h}"/>`}).join('')}</svg>`;
}

function renderThemes(){
  const ps = problemStats();
  if(!ps.length){ $('#themes').innerHTML = '<div class="panel empty">No feedback matches these filters. Try a wider date range.</div>'; return; }
  const rank = s=> state.sort==='priority' ? -score(s.n,s.t) : s.list[0].ago;
  const themes = THEMES.map(t=>{
    const items = ps.filter(s=>s.p.theme===t.id).sort((a,b)=>rank(a)-rank(b));
    const list = items.flatMap(s=>s.list);
    return {t, items, list, top: items.length? Math.max(...items.map(s=>score(s.n,s.t))):0, recent: items.length? Math.min(...items.map(s=>s.list[0].ago)):0};
  }).filter(x=>x.items.length).sort((a,b)=> state.sort==='priority'? b.top-a.top : a.recent-b.recent);

  $('#themes').innerHTML = themes.map(({t,items,list})=>{
    const c = typeCounts(list), tot = list.length;
    const bar = Object.keys(TYPES).map(k=>c[k]?`<i class="${TYPES[k].cls}" style="width:${c[k]/tot*100}%" title="${TYPES[k].label}: ${c[k]}"></i>`:'').join('');
    return `<article class="panel" aria-label="${esc(t.name)}">
      <div class="theme-h">
        <div class="row"><h2>${esc(t.name)}</h2><small style="color:var(--muted)">${items.length} problem${items.length>1?'s':''} · ${tot} mentions</small></div>
        <p>${esc(t.desc)}</p><div class="bar" aria-hidden="true">${bar}</div>
      </div>
      ${items.map(s=>problemHTML(s)).join('')}
    </article>`;
  }).join('');
}

function problemHTML(s){
  const {p,list,c,t,n} = s, open = state.open.has(p.id);
  const [sc,sl] = strength(n,t);
  const emerging = s.first!==null && s.first<=2;
  const showAll = state.allq.has(p.id), shown = showAll? list : list.slice(0,3);
  return `<div class="prob" id="prob-${p.id}">
    <button type="button" class="prob-head" data-act="toggle" data-id="${p.id}" aria-expanded="${open}">
      <span class="sig"><b>${n}</b><small>mentions</small></span>
      <span><span class="ptitle">${esc(p.title)}</span>
        <span class="ptags"><span class="pill ${sc}">${sl}</span><span class="note">${t} of 4 source types</span>
          ${emerging?'<span class="pill warn">Emerging</span>':''}${s.today?`<span class="pill new">+${s.today} today</span>`:''}</span></span>
      <span class="tri">${chips(c)}</span>
      <span class="chev" aria-hidden="true">▸</span>
    </button>
    ${open?`<div class="prob-body">
      <p class="stmt"><span class="lbl">Problem to solve (synthesized)</span>${esc(p.stmt)}</p>
      <div><span class="lbl">Mentions per week, last 12 weeks</span>${spark(s.every)}</div>
      <div><span class="lbl">Features that could address it</span><div class="chips">${p.features.map(f=>`<span class="feat">${esc(FEATURES[f])}</span>`).join('')}</div></div>
      <div><span class="lbl">Customer evidence (${list.length})</span>
        <ul class="quotes">${shown.map(e=>quoteHTML(e)).join('')}</ul></div>
      ${list.length>3?`<button type="button" class="more" data-act="allq" data-id="${p.id}">${showAll?'Show fewer quotes':'Show all '+list.length+' quotes'}</button>`:''}
    </div>`:''}
  </div>`;
}

function renderFeatures(){
  const ps = problemStats(); const map = {};
  ps.forEach(s=>s.p.features.forEach(f=>{ (map[f]=map[f]||{ev:new Map(),probs:[]}); s.list.forEach(e=>map[f].ev.set(e.id,e)); map[f].probs.push(s); }));
  const rows = Object.entries(map).map(([f,m])=>{ const list=[...m.ev.values()]; return {f,n:list.length,t:nTypes(typeCounts(list)),probs:m.probs}; }).sort((a,b)=>b.n-a.n).slice(0,9);
  const max = Math.max(1,...rows.map(r=>r.n));
  $('#features').innerHTML = rows.length? rows.map(r=>`<li><button type="button" data-act="goto" data-id="${r.probs[0].p.id}">
    <span class="r1"><span>${esc(FEATURES[r.f])}</span><span>${r.n}</span></span>
    <span class="meter"><i style="width:${r.n/max*100}%"></i></span>
    <small>${r.t} source types · addresses ${r.probs.length} problem${r.probs.length>1?'s':''}</small></button></li>`).join('') : '<li class="empty">No features linked to this selection.</li>';
}

function renderDrawer(){
  const host = $('#overlay');
  const e = EV.find(x=>x.id===state.drawer);
  if(!e){ host.innerHTML=''; return; }
  const v = state.verified.has(e.id), p = prob(e.p);
  const kind = {interview:'Open recording at '+e.loc, survey:'Open response in survey tool', ticket:'Open ticket in Zendesk', meeting:'Open recording at '+e.loc}[e.type];
  host.innerHTML = `<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Source detail">
    <div class="dh"><div>${chip(e.type,'').replace(/ <span><\/span>/,'')}<h2>${esc(e.src)}</h2></div>
      <button type="button" class="btn" data-act="close" id="dclose">Close</button></div>
    <div class="db">
      <div class="ctx"><div class="p">${esc(e.prompt)}</div>
        <div><mark>${esc(e.quote)}</mark></div>
        <div class="note">Excerpt shown exactly as captured. Location: <span class="mono">${esc(e.loc)}</span></div></div>
      <dl class="dl">
        <dt>Source</dt><dd>${TYPES[e.type].label}</dd>
        <dt>Speaker</dt><dd>${esc(e.who)}</dd>
        <dt>Date</dt><dd>${fmt(e.ago)} (${rel(e.ago).toLowerCase()})</dd>
        <dt>Persona</dt><dd>${PERS[e.pers]}</dd>
        <dt>Project</dt><dd>${PROJ[e.proj]}</dd>
        <dt>Linked problem</dt><dd>${esc(p.title)}</dd>
      </dl>

function render(){ renderFilters(); renderStats(); renderToday(); renderThemes(); renderFeatures(); renderDrawer(); }

/* ---------- events ---------- */
function toast(msg){
  const h=$('#toast-host'); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;
  setTimeout(()=>{h.innerHTML='';},2200);
}
document.addEventListener('click',ev=>{
  const f = ev.target.closest('[data-f]');
  if(f){ state[f.dataset.f]=f.dataset.v; render(); return; }
  const a = ev.target.closest('[data-act]'); if(!a) return;
  const id = a.dataset.id, act = a.dataset.act;
  if(act==='toggle'){ state.open.has(id)?state.open.delete(id):state.open.add(id); renderThemes(); }
  else if(act==='allq'){ state.allq.has(id)?state.allq.delete(id):state.allq.add(id); renderThemes(); }
  else if(act==='goto'){ state.open.add(id); renderThemes(); const el=document.getElementById('prob-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(act==='source'){ state.drawer=id; renderDrawer(); }
  else if(act==='close'){ state.drawer=null; renderDrawer(); }
  else if(act==='original'){ toast('Prototype: would open the original record'); }
  else if(act==='verify'){
    state.verified.has(id)?state.verified.delete(id):state.verified.add(id);
    try{localStorage.setItem('ci-verified',JSON.stringify([...state.verified]));}catch(e){}
    renderDrawer(); renderThemes(); renderToday();
  }
  else if(act==='copy'){
    const e=EV.find(x=>x.id===id);
    const txt = `"${e.quote}" — ${e.who}, ${e.src} (${e.loc}), ${fmt(e.ago)}`;
    const done=()=>toast('Citation copied');
    try{ navigator.clipboard.writeText(txt).then(done,()=>toast('Copy blocked. Select the quote text instead.')); }catch(x){ toast('Copy blocked. Select the quote text instead.'); }
  }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&state.drawer){ state.drawer=null; renderDrawer(); } });

$('#dateline').textContent = TODAY.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + ' · daily digest';
render();
</script>
